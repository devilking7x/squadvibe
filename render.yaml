services:
  - type: web
    name: squadvibe
    runtime: node
    plan: free
    region: singapore
    repo: https://github.com/devilking7x/squadvibe
    branch: main
    buildCommand: >-
      cd web && npm install --no-audit --no-fund && npm run build &&
      cd ../server && npm install --no-audit --no-fund && npm run build &&
      rm -rf web && mkdir -p web && cp -r ../web/dist/* web/
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: QLOO_MOCK
        value: "0"
      # QLOO_API_KEY: set in the Render dashboard (never commit it)
      # QLOO_API_URL defaults to the hackathon env: https://hackathon.api.qloo.com/v2
